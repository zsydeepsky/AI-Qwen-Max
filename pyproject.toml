[project]
name = "ai-qwen-max"
version = "1.0.0"
description = "Maximally efficient local Qwen inference service for AMD Ryzen AI Max+ 395 (Strix Halo) on Windows"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
]

[project.scripts]
max = "ai_qwen_max.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_qwen_max"]
