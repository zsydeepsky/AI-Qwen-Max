<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Qwen-Max</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/shell.css">
</head>
<body>

<!-- 移动端抽屉遮罩 -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- 侧边导航 -->
<aside class="shell-sidebar" id="sidebar">
  <div class="shell-brand">
    <h1>🏯 AI-Qwen-Max</h1>
    <div class="subtitle">本地推理 · OpenAI API</div>
    <div class="port-selector">
      <label for="portInput">端口:</label>
      <input type="number" id="portInput" value="8080" min="1" max="65535" step="1">
      <span class="connection-status" id="connStatus" title="连接状态"></span>
    </div>
  </div>

  <nav class="shell-nav">
    <div class="nav-section">功能</div>
    <button class="nav-item active" data-page="chat.html" data-title="对话">
      💬 对话
    </button>
    <button class="nav-item" data-page="apilog.html" data-title="API 日志">
      📡 API 日志
    </button>
    <button class="nav-item" data-page="status.html" data-title="运行状态">
      ⚙ 运行状态
    </button>
  </nav>

  <div class="shell-footer">ESC 键返回 CLI · v1.0</div>
</aside>

<!-- 主区 -->
<div class="shell-main">
  <header class="shell-topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="page-title" id="pageTitle">对话</span>
    <span class="health-indicator" id="healthIndicator">检查中...</span>
    <div class="shutdown-wrap">
      <button class="shutdown-btn" id="shutdownBtn" title="关闭推理服务器" disabled>⏻</button>
      <div class="shutdown-menu" id="shutdownMenu" hidden>
        <div class="shutdown-menu-title">⚠ 关闭推理服务器？</div>
        <div class="shutdown-menu-sub">退出前会保存 KV 缓存到 SSD；正在进行的对话将被中断，且无法再发起请求。</div>
        <div class="shutdown-menu-actions">
          <button class="shutdown-cancel" onclick="toggleShutdownMenu()">取消</button>
          <button class="shutdown-confirm" onclick="confirmShutdown()">确认关闭</button>
        </div>
      </div>
    </div>
  </header>

  <iframe class="page-frame" id="pageFrame" src="chat.html" title="内容区"></iframe>
</div>

<script src="js/common.js"></script>
<script>
// ===== 导航切换 =====
const PAGES = { 'chat.html': '对话', 'apilog.html': 'API 日志', 'status.html': '运行状态' };

function switchPage(page) {
  const iframe = document.getElementById('pageFrame');
  if (iframe.dataset.page === page) return;   // 已在该页
  iframe.src = page;
  iframe.dataset.page = page;
  document.getElementById('pageTitle').textContent = PAGES[page] || page;
  document.querySelectorAll('.nav-item').forEach(b =>
    b.classList.toggle('active', b.dataset.page === page));
  // 刷新后回发一次当前端口，保证子页面拿到最新值（load 时读取，避免旧值覆盖）
  iframe.addEventListener('load', () => {
    const port = document.getElementById('portInput').value || '8080';
    iframe.contentWindow.postMessage({ source: 'max-shell', type: 'port', port }, '*');
  }, { once: true });
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => switchPage(btn.dataset.page));
});

// ===== 侧栏抽屉（移动端） =====
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

document.getElementById('sidebarOverlay').addEventListener('click', toggleSidebar);

// ===== 端口管理 =====
const portInput = document.getElementById('portInput');
// 默认取当前服务端口（页面由后端自身提供），并同步清除历史残留，用户无需手动改端口；
// 非 http(s) 打开（如 file://）时退回 localStorage / 8080。
const servedPort = (location.protocol === 'http:' || location.protocol === 'https:')
  ? parseInt(location.port, 10) : 0;
if (servedPort) {
  portInput.value = String(servedPort);
  localStorage.setItem('max_port', String(servedPort));
} else {
  const savedPort = localStorage.getItem('max_port');
  if (savedPort) portInput.value = savedPort;
}

function broadcastPort() {
  const port = portInput.value || '8080';
  const iframe = document.getElementById('pageFrame');
  if (iframe.contentWindow) {
    iframe.contentWindow.postMessage({ source: 'max-shell', type: 'port', port }, '*');
  }
  checkConnection();
}

portInput.addEventListener('change', () => {
  localStorage.setItem('max_port', portInput.value);
  broadcastPort();
});

// ===== 连接状态 / 健康轮询 =====
const connStatus = document.getElementById('connStatus');

async function checkConnection() {
  const data = await Common.apiFetchSilent('/health');
  connStatus.classList.toggle('connected', !!data);
  await updateHealthIndicator();
}

async function updateHealthIndicator() {
  const el = document.getElementById('healthIndicator');
  const data = await Common.apiFetchSilent('/health');
  if (data && (data.status === 'ok' || data.loaded)) {
    el.textContent = '● 就绪';
    el.className = 'health-indicator ready';
    setShutdownOnline(true);
  } else if (data) {
    el.textContent = '◐ 加载中...';
    el.className = 'health-indicator';
    setShutdownOnline(false);
  } else {
    el.textContent = '未连接';
    el.className = 'health-indicator';
    setShutdownOnline(false);
  }
}

// ===== 关机 =====
function setShutdownOnline(online) {
  const btn = document.getElementById('shutdownBtn');
  btn.disabled = !online;
  if (!online) document.getElementById('shutdownMenu').hidden = true;
}

function toggleShutdownMenu() {
  const menu = document.getElementById('shutdownMenu');
  menu.hidden = !menu.hidden;
}

async function confirmShutdown() {
  const btn = document.getElementById('shutdownBtn');
  const menu = document.getElementById('shutdownMenu');
  menu.hidden = true;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const r = await Common.apiFetch('/shutdown', { method: 'POST' });
    Common.showToast(r.message || '关闭指令已发出');
    document.getElementById('healthIndicator').textContent = '未连接';
    document.getElementById('healthIndicator').className = 'health-indicator';
    connStatus.classList.remove('connected');
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '⏻';
    Common.showToast('关闭失败：' + e.message);
  }
}

// 点击关机区外关闭确认菜单
document.addEventListener('click', (e) => {
  if (!e.target.closest('.shutdown-wrap')) {
    document.getElementById('shutdownMenu').hidden = true;
  }
});

// ===== 初始化 =====
(async function init() {
  await checkConnection();
  setInterval(() => updateHealthIndicator(), 5000);
})();
</script>
</body>
</html>
